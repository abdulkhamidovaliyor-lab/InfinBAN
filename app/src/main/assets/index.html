<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#fff;overflow:hidden}#screen{position:fixed;inset:0;overflow:auto;background:#fff}.shot{display:block;width:100%;height:auto}.nav{position:fixed;left:0;right:0;bottom:0;height:12%;z-index:20;display:flex}.nav div{flex:1}.pinpad{position:fixed;left:12%;right:12%;top:47%;bottom:11%;display:grid;grid-template-columns:repeat(3,1fr);z-index:30}.pinpad button{opacity:0;border:0}.hot{position:fixed;z-index:25;background:transparent;border:0}.historyClick{position:absolute;left:0;right:0;height:13%;z-index:10}.stack img{display:block;width:100%}</style></head><body><div id="screen"></div><script>
let pin='';const S=document.getElementById('screen');
function image(n){S.innerHTML='<img class="shot" src="img/'+n+'">'}
function nav(active){let n=document.createElement('div');n.className='nav';['home','transfers','payments','history'].forEach((x,i)=>{let d=document.createElement('div');d.onclick=()=>show(x);n.appendChild(d)});document.body.appendChild(n)}
function clearNav(){document.querySelectorAll('.nav,.pinpad,.hot').forEach(x=>x.remove())}
function show(x){clearNav();if(x==='pin'){image('pin.png');let k=document.createElement('div');k.className='pinpad';['1','2','3','4','5','6','7','8','9','x','0','del'].forEach(v=>{let b=document.createElement('button');b.onclick=()=>{if(v==='del')pin=pin.slice(0,-1);else if(v!=='x')pin+=v;if(pin.length===4){pin='';show('home')}};k.appendChild(b)});document.body.appendChild(k);return}if(x==='history'){S.innerHTML='<div class="stack">'+[1,2,3,4,5,6].map(i=>'<div style="position:relative"><img src="img/history'+i+'.png"><button class="historyClick" style="top:31%" onclick="openCheck('+i+')"></button></div>').join('')+'</div>';nav();return}image(x+'.png');nav()}
function openCheck(i){clearNav();image('check'+i+'.png');let back=document.createElement('button');back.className='hot';back.style='left:0;top:3%;width:18%;height:12%';back.onclick=()=>show('history');document.body.appendChild(back);let rec=document.createElement('button');rec.className='hot';rec.style='left:50%;bottom:0;width:50%;height:13%';rec.onclick=()=>openReceipt(i);document.body.appendChild(rec)}
function openReceipt(i){clearNav();image('receipt'+i+'.png');let back=document.createElement('button');back.className='hot';back.style='left:0;top:3%;width:18%;height:12%';back.onclick=()=>openCheck(i);document.body.appendChild(back)}
show('pin');
</script></body></html>
